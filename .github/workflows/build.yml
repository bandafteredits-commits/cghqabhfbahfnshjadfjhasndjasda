name: Build critbob

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show repo files
        shell: bash
        run: ls -la

      - name: Build critbob.dll
        shell: cmd
        run: cl /nologo /O2 /GL /MT /EHsc /LD critbob.cpp /link /LTCG /OUT:critbob.dll d3d11.lib dxgi.lib user32.lib

      - name: Build critbob_inject.exe
        shell: cmd
        run: cl /nologo /O2 /GL /MT /EHsc critbob_inject.cpp /link /LTCG /OUT:critbob_inject.exe advapi32.lib

      - name: Bundle into HTMI.proxx.bundled.exe
        shell: bash
        run: |
          set -e
          python bundle_critbob.py HTMI.proxx.exe critbob.dll critbob_inject.exe
          ls -la

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          # required outputs
          cp critbob.dll critbob_inject.exe out/
          # bundled exe (the script's output) and optional extras
          for f in HTMI.proxx.bundled.exe critbob_sig.txt critbob.ini; do
            if [ -f "$f" ]; then cp "$f" out/; else echo "WARNING: $f not found, skipping"; fi
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: critbob-build
          path: out/
          if-no-files-found: error
